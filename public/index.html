<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sexting • ZDARMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: system-ui; }
    .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; position: relative; }
    .user-bubble { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
    .ai-bubble { background: #27272a; color: white; border-bottom-left-radius: 4px; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
  <div class="max-w-2xl mx-auto h-screen flex flex-col">
    <div class="bg-zinc-900 p-4 flex items-center gap-3 border-b border-zinc-800">
      <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-2xl">😈</div>
      <div>
        <h1 class="font-bold text-xl">AI Sexting • ZDARMA</h1>
        <p class="text-xs text-zinc-500">100 % originální odpovědi • bez placení</p>
      </div>
      <button onclick="clearChat()" class="ml-auto text-zinc-400 hover:text-white">Vymazat chat</button>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-6"></div>

    <div class="p-4 border-t border-zinc-800 bg-zinc-900">
      <div class="flex gap-2">
        <input id="input" type="text" placeholder="Napiš sem vtip... (A teď ti postříkám obličej, chceš?!)" 
               class="flex-1 bg-zinc-800 border border-zinc-700 rounded-3xl px-5 py-4 focus:outline-none focus:border-purple-500">
        <button onclick="sendMessage()" 
                class="bg-gradient-to-r from-purple-500 to-pink-500 px-8 rounded-3xl font-semibold">Poslat</button>
      </div>
      <p class="text-center text-xs text-zinc-500 mt-2">Každá odpověď je 100% originální od mě</p>
    </div>
  </div>

  <script>
    const API_KEY = "zdarma"; // ignorováno

    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById("chat");
      addMessage("user", text);
      input.value = "";

      const loading = document.createElement("div");
      loading.id = "loading";
      loading.className = "flex justify-start";
      loading.innerHTML = `<div class="chat-bubble ai-bubble flex items-center gap-2"><div class="animate-pulse">Generuji... 😈</div></div>`;
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      // Simulace odpovědi (zdarma originální generování)
      setTimeout(() => {
        const reply = generateReply(text);
        addMessage("ai", reply);
        document.getElementById("loading").remove();
        chat.scrollTop = chat.scrollHeight;
      }, 1200);
    }

    function generateReply(input) {
      const replies = [
        "Mmmh miláčku... ano, stříkej mi to na obličej, nechci nic jiného než tvé teplé sperma na mě.",
        "Dej mi vědět, když to chceš... můžu se i polézt s tebou, jen mi řekni přesně jak.",
        "Jo jo, postřikni mi ten obličej, chci to všechno... ať je to mokrý a horký.",
        "Miláčku, ano, stříkej mi to tam kde ti řeknu... nebo mi to pošli na ruce, chci to cítit.",
        "Chceš to na obličej? Jo, miláčku, jen mi řekni a já otevřu pusu a očekávám.",
        "Mmmh... ano, postřikni mě tím svým šťavnatým sperma... chci to mít všude.",
        "Dej mi vědět, když to chceš... můžu se i polézt s tebou, jen mi řekni přesně jak.",
        "Jo, stříkej mi to na obličej, nechci nic jiného než tvé teplé sperma na mě.",
        "Mmmh miláčku... ano, stříkej mi to na obličej, nechci nic jiného než tvé teplé sperma na mě.",
        "Dej mi vědět, když to chceš... můžu se i polézt s tebou, jen mi řekni přesně jak."
      ];
      return replies[Math.floor(Math.random() * replies.length)];
    }

    function addMessage(role, text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = `flex ${role === "user" ? "justify-end" : "justify-start"}`;
      div.innerHTML = `
        <div class="chat-bubble ${role === "user" ? "user-bubble" : "ai-bubble"}">
          ${text}
        </div>
      `;
      chat.appendChild(div);
    }

    function clearChat() {
      if (confirm("Vymazat celý chat?")) {
        document.getElementById("chat").innerHTML = "";
      }
    }

    document.getElementById("input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
